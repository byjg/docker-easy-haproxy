[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certbot-plugin"
version = "1.0.0"
description = "Standalone ACME certificate manager plugin for EasyHAProxy"
requires-python = ">=3.11"
dependencies = [
    "pyopenssl>=24.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-v -p no:warnings"
testpaths = ["tests"]
pythonpath = ["."]
