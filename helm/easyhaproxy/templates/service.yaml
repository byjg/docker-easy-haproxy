{{ if .Values.service.create }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easyhaproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easyhaproxy.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: 80
      {{ if eq .Values.service.type "NodePort" }}nodePort: {{ dig "nodePorts" "http" 31080 .Values.binding }}{{ end }}
    - name: https
      port: 443
      {{ if eq .Values.service.type "NodePort" }}nodePort: {{ dig "nodePorts" "https" 31443 .Values.binding }}{{ end }}
    {{- if include "easyhaproxy.statsEnabled" . }}
    - name: stats
      port: 1936
      {{ if eq .Values.service.type "NodePort" }}nodePort: {{ dig "nodePorts" "stats" 31936 .Values.binding }}{{ end }}
    - name: dashboard
      port: 11936
      {{ if eq .Values.service.type "NodePort" }}nodePort: {{ dig "nodePorts" "dashboard" 31937 .Values.binding }}{{ end }}
    {{- end }}
    {{- range $port := .Values.binding.additionalPorts }}
    - name: extra{{ $port }}
      port: {{ $port }}
      {{ if eq $.Values.service.type "NodePort" }}nodePort: {{ $port }}{{ end }}
    {{- end }}


  selector:
    {{- include "easyhaproxy.selectorLabels" . | nindent 4 }}
{{ end }}