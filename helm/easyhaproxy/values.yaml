# Default values for easyhaproxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: byjg/easy-haproxy
  pullPolicy: Always # IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  create: false          # If false, it will create a Daemonset with hostPort. The easiest. 
  type: ClusterIP        # ClusterIP, NodePort or LoadBalancer
  annotations: {}

binding:
  # Host ports (DaemonSet mode, service.create: false)
  ports:
    http: 80
    https: 443
    stats: 1936
    dashboard: 11936
  # Node ports (service.type: NodePort); Kubernetes only accepts 30000-32767 by default
  nodePorts:
    http: 31080
    https: 31443
    stats: 31936
    dashboard: 31937
  additionalPorts: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

# IngressClass configuration
ingressClass:
  # Create IngressClass resource
  create: true
  # Additional annotations for the IngressClass
  annotations: {}

# Ingress status update configuration
ingressStatus:
  # Enable updating ingress status with load balancer IPs
  enabled: true
  # Deployment mode: auto (detect), daemonset, nodeport, or clusterip
  deploymentMode: auto
  # External hostname override (for ClusterIP mode without LoadBalancer)
  externalHostname: ""
  # How often to update status (seconds)
  updateInterval: 30

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
#  requests:
#    cpu: "100m"
#    memory: "128Mi"
#  limits:
#    cpu: 100m
#    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

easyhaproxy:
  stats:
    enabled: true        # false: no stats page or dashboard, and ports 1936/11936 are not exposed
    username: admin
    password: password
    corsOrigin: ""
  refresh: "10"
  customErrors: "true"
  sslMode: loose
  logLevel:
    certbot: DEBUG
    easyhaproxy: DEBUG
    haproxy: DEBUG
  certbot:
    email: ""

# Persist the ACME/Certbot certificates (/etc/easyhaproxy/certs/certbot).
# Without it, every pod restart requests the certificates again and can hit
# the CA rate limits. With service.create: true the Deployment uses the
# Recreate strategy, because a ReadWriteOnce volume can't move to the new pod
# while the old one still holds it.
persistence:
  certbot:
    enabled: false
    existingClaim: ""    # Use this PVC instead of creating one
    storageClass: ""     # "" = cluster default
    accessMode: ReadWriteOnce
    size: 1Gi

# Master node configuration - only used when service.create is false (DaemonSet mode)
# When service.create is true (Deployment with ClusterIP/NodePort), this is ignored
masterNode:
  label: easyhaproxy/node
  values:
    - master

# Extra environment variables to inject into the container
# Supports all Kubernetes env var forms: value, valueFrom (secretKeyRef, configMapKeyRef, fieldRef)
# extraEnv:
#   - name: MY_VAR
#     value: "my-value"
#   - name: SECRET_VAR
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: my-key
extraEnv: []
